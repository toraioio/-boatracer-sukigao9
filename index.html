<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ボートレーサー 好き顔9選</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">BOAT RACE</div><h1>好き顔9選</h1><p>現役レーサーの顔を見比べて、好きな方をタップ！</p></header><section id="setup" class="panel"><h2>何人くらい比べる？</h2><div class="choices"><button data-rounds="100">100回</button><button data-rounds="200" class="primary">200回</button><button data-rounds="300">300回</button></div><p class="note">全レーサーからランダムに対戦。選んだ結果はこの端末内だけで計算します。</p></section><section id="game" hidden><div class="bar"><span id="progress">0 / 200</span><button id="undo">↩ 戻る</button></div><div class="cards"><button class="card" id="left"><img><div class="name"></div><div class="meta"></div></button><div class="vs">VS</div><button class="card" id="right"><img><div class="name"></div><div class="meta"></div></button></div><div class="actions"><button id="skip">この2人は選ばない</button><button id="both">どっちも好き</button></div></section><section id="result" hidden><h2>あなたの好き顔 TOP 9</h2><div id="ranking"></div><button id="again" class="primary wide">もう一度遊ぶ</button><p class="source">写真・選手情報：<a href="https://www.boatrace.jp/owpc/pc/data/racersearch/index" target="_blank" rel="noopener">BOAT RACE オフィシャルウェブサイト</a></p></section></main><script src="racers.js"></script><script src="app.js"></script></body></html>
